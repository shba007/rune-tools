[workspace]
members = [
    "crates/rune-pdk",
    "plugins/rune-fetch",
    "plugins/rune-fs",
    "plugins/rune-git", "plugins/rune-media",
    "plugins/rune-memory", "plugins/rune-sequentialthinking",
    "plugins/rune-time",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
extism-pdk = "1.4.1"
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "serde",
    "std",
] }
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
walkdir = "2.5.0"
glob-match = "0.2.1"
mime_guess = "2.0.5"
html2text = "0.17.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
