[workspace]
members = [
  "crates/rune-pdk",
  "crates/rune-sidecar",
  "plugins/mhb-mconnect",
  "plugins/rune-audio",
  "plugins/rune-browser",
  "plugins/rune-email",
  "plugins/rune-fetch",
  "plugins/rune-figma",
  "plugins/rune-filesystem",
  "plugins/rune-git",
  "plugins/rune-image",
  "plugins/rune-memory",
  # "plugins/rune-print",
  # "plugins/rune-scan",
  "plugins/rune-sequential-thinking",
  "plugins/rune-slides",
  # "plugins/rune-ssh",
  "plugins/rune-time",
  "plugins/rune-video",
  # "plugins/rune-game-engine",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Shirsendu Bairagi"]

[workspace.dependencies]
rune-pdk = { path = "crates/rune-pdk" }
rune-sidecar = { path = "crates/rune-sidecar" }
extism = "1.30"
extism-pdk = "1.4"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tempfile = "3.27"
cocogitto = "7.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
