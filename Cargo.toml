[workspace]
members = [
    "crates/rune-pdk",
    "plugins/rune-fs",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
extism-pdk = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1