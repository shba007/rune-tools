[workspace]
members = [
    "crates/rune-pdk",
    "crates/rune-sidecar",
    "plugins/rune-fetch",
    "plugins/rune-filesystem",
    "plugins/rune-git",
    "plugins/rune-media",
    "plugins/rune-memory",
    "plugins/rune-print",
    "plugins/rune-sequentialthinking",
    "plugins/rune-time",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
extism = "1.30"
extism-pdk = "1.4"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
    "std",
] }
chrono-tz = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
walkdir = "2.5"
glob-match = "0.2"
mime_guess = "2.0"
reqwest = { version = "0.13", features = ["blocking", "json"] }
tempfile = "3.27"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
