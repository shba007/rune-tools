[plugin]
name = "rune-audio"
execution_model = "native"
description = "Audio track extraction using yt-dlp, ffmpeg, and spotdl for podcast and audio content management."
version = "0.3.0"
authors = ["Shirsendu Bairagi"]
license = "MIT"
documentation = "https://github.com/shba007/rune-tools/blob/main/plugins/rune-audio/README.md"

[capabilities]
network_hosts = [
  "youtube.com",
  "www.youtube.com",
  "youtu.be",
  "spotify.com",
  "open.spotify.com",
  "apple.com",
  "music.apple.com",
]
filesystem = { mode = "scoped", root_param = "allowed_dir" }
exec = { allowed_binaries = ["ffmpeg", "yt-dlp", "spotdl"] }

[dependencies.binaries.ffmpeg]
version = ">=6.0"
optional = false
description = "Audio transcoding, format conversion, and metadata embedding"

[dependencies.binaries.yt-dlp]
version = ">=2024.01.01"
optional = false
description = "Audio extraction from web streams"

[dependencies.binaries.spotdl]
version = ">=4.2.0"
optional = true
description = "Spotify and Apple Music downloader with ID3 tag and lyrics generation"

[configuration]
schema_version = 1

[configuration.fields.allowed_dir]
type = "string"
description = "Owner-selected filesystem root. Supply an absolute trusted directory; this metadata grants no filesystem permissions."
required = false
secret = false
env = ["ALLOWED_DIR"]

[configuration.fields.output_directory]
type = "string"
description = "Default output directory when the call does not supply one. OUTPUT_DIRECTORY takes precedence over OUTPUT_DIR, then ALLOWED_DIR."
required = false
secret = false
env = ["OUTPUT_DIRECTORY", "OUTPUT_DIR", "ALLOWED_DIR"]

[configuration.fields.cookies_file]
type = "string"
description = "Path to a cookie file for authenticated downloads; takes precedence over cookie directory and browser extraction."
required = false
secret = true
env = ["COOKIES_FILE"]

[configuration.fields.cookies_dir]
type = "string"
description = "Directory containing domain-matched cookie files for downloads."
required = false
secret = false
env = ["COOKIES_DIR"]

[configuration.fields.cookies_from_browser]
type = "string"
description = "Browser identifier used to obtain cookies when no explicit or matching cookie file is selected."
required = false
secret = false
env = ["COOKIES_FROM_BROWSER"]

[configuration.fields.proxy]
type = "string"
description = "Proxy URL for downloads. HTTPS_PROXY takes precedence over HTTP_PROXY, then PROXY. May contain credentials."
required = false
secret = true
env = ["HTTPS_PROXY", "HTTP_PROXY", "PROXY"]

[configuration.fields.audio_quality]
type = "integer"
description = "Default yt-dlp audio quality when audioQuality is omitted."
required = false
secret = false
env = ["AUDIO_QUALITY"]
default = 0

[configuration.fields.include_lyrics]
type = "boolean"
description = "Default inclusion of lyrics for Spotify downloads."
required = false
secret = false
env = ["INCLUDE_LYRICS"]
default = false
