[plugin]
name = "rune-memory"
version = "0.3.0"
execution_model = "wasm"
description = "Persistent knowledge graph memory for storing and querying entities, relations, and observations."
authors = ["Shirsendu Bairagi"]
license = "MIT"
documentation = "https://github.com/shba007/rune-tools/blob/main/plugins/rune-memory/README.md"

[capabilities]
network_hosts = []
filesystem = { mode = "scoped", root_param = "allowed_dir" }
exec = { allowed_binaries = [] }

[configuration]
schema_version = 1

[configuration.fields.allowed_dir]
type = "string"
description = "Owner-selected filesystem root. Supply an absolute trusted directory; this metadata grants no filesystem permissions."
required = false
secret = false
config_key = "allowed_dir"

[configuration.fields.memory_file]
type = "string"
description = "Knowledge graph JSON file, resolved against allowed_dir when configured. Per-call memoryFile overrides this setting."
required = false
secret = false
config_key = "memory_file"
default = "memory.json"
