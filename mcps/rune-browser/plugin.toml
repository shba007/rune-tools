[plugin]
name = "rune-browser"
version = "0.3.0"
execution_model = "native"
description = "Browser automation with agent-browser (headless) and CDP (existing browser) support. Features: navigation, element interaction, form filling, screenshots, PDF export, console/network diagnostics, and persistent sessions."
authors = ["Shirsendu Bairagi"]
license = "MIT"
documentation = "https://github.com/shba007/rune-tools/blob/main/plugins/rune-browser/README.md"

[capabilities]
network_hosts = ["localhost", "127.0.0.1"]
filesystem = { mode = "scoped", root_param = "allowed_dir" }
exec = { allowed_binaries = ["agent-browser", "rune-browser-native"] }

[dependencies.binaries.agent-browser]
version = ">=0.38.0"
optional = false
description = "Headless browser automation engine"

[configuration]
schema_version = 1

[configuration.fields.allowed_dir]
type = "string"
description = "Owner-selected filesystem root. Supply an absolute trusted directory; this metadata grants no filesystem permissions."
required = false
secret = false
env = ["ALLOWED_DIR"]

[configuration.fields.output_directory]
type = "string"
description = "Default output directory when the call does not supply one. OUTPUT_DIRECTORY takes precedence over OUTPUT_DIR, then ALLOWED_DIR."
required = false
secret = false
env = ["OUTPUT_DIRECTORY", "OUTPUT_DIR", "ALLOWED_DIR"]
