[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rune-pdk.workspace = true
serde_json.workspace = true
toml = "1.1"
toml_edit = "0.25"
git-conventional = "1.1"
semver = "1"
serde = { workspace = true }
sha2 = "0.11"
dotenvy = "0.15"

[dev-dependencies]
tempfile.workspace = true

# Installs .cargo-husky/hooks/* into .git/hooks when xtask's tests are built.
[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]
