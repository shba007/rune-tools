[package]
default-run = "xtask"
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rune-pdk.workspace = true
serde_json.workspace = true
toml = "1.1"
toml_edit = "0.25"
cocogitto = "=7.0.0"
conventional_commit_parser = "=0.9.4"
chrono = "0.4"
semver = "1"
serde = { workspace = true }
sha2 = "0.11"
dotenvy = "0.15"
reqwest.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Installs .cargo-husky/hooks/* into .git/hooks when xtask's tests are built.
[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

[[bin]]
name = "render-notes"
path = "src/render_notes.rs"
