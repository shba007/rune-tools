[package]
name = "rune-image"
description = "A MCP server for multi-platform image extraction, visual comparison, and flexible format conversion including SVG and raster files."
version = "0.2.2"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rune-image-native"
path = "src/bin/native_sidecar.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
rune-pdk.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", features = ["png", "jpeg", "gif", "webp"] }
image-compare = "0.5"
resvg = { version = "0.48", default-features = false }
vtracer = "0.6.5"
visioncortex = "0.8.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune-sidecar.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk.workspace = true

[dev-dependencies]
tempfile.workspace = true
