[package]
name = "rune-filesystem"
description = "Sandboxed filesystem manipulation: line-based reading, multimodal media reads, atomic writes, line edits with dry-run diffs, tree views, glob search, and safe moves within an enforced boundary"
version = "0.3.5"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rune-pdk.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
base64 = "0.23"
walkdir = "2.5"
glob-match = "0.2"
mime_guess = "2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk.workspace = true

[dev-dependencies]
tempfile.workspace = true
