[plugin]
name = "rune-filesystem"
execution_model = "wasm"
description = "Filesystem operations including directory walking, file paging, and path manipulation."
version = "0.4.1"
authors = ["Shirsendu Bairagi"]
license = "MIT"
capabilities = { network_hosts = [
], filesystem = { mode = "scoped", root_param = "allowed_dir" }, exec = { allowed_binaries = [
] } }
documentation = "https://github.com/shba007/rune-tools/blob/main/plugins/rune-filesystem/README.md"

[configuration]
schema_version = 1

[configuration.fields.allowed_dir]
type = "string"
description = "Owner-selected filesystem root. Supply an absolute trusted directory; this metadata grants no filesystem permissions."
required = true
secret = false
config_key = "allowed_dir"
