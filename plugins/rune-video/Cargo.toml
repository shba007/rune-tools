[package]
name = "rune-video"
version = "0.1.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Video streaming, playlist extraction, and media trimming using ffmpeg, streamlink, and yt-dlp."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rune-video-native"
path = "src/bin/native_sidecar.rs"
required-features = ["native"]

[features]
default = []
native = ["dep:rune-sidecar"]

[dependencies]
rune-pdk = { path = "../../crates/rune-pdk" }
rune-sidecar = { path = "../../crates/rune-sidecar", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
