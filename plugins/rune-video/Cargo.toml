[package]
name = "rune-video"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Video streaming, playlist extraction, and media trimming using ffmpeg, streamlink, and yt-dlp."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rune-video-native"
path = "src/bin/native_sidecar.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
rune-pdk.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune-sidecar.workspace = true
reqwest = { workspace = true }
zip.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
