[package]
name = "rune-browser"
description = "Headless browser automation: page navigation, element interaction, form filling, JavaScript evaluation, screenshots, PDF export, network/console capture, and persistent session profiles"
version = "0.2.4"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rune-browser-native"
path = "src/bin/native_sidecar.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
rune-pdk.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune-sidecar.workspace = true
reqwest = { workspace = true }
tokio = { version = "1", features = ["full"] }
zip.workspace = true
tar = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["zlib"] }
xz2 = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk.workspace = true

[dev-dependencies]
tempfile.workspace = true
