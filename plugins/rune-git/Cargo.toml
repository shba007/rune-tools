[package]
name = "rune-git"
description = " Git repository management: status, diff, staging, committing, branching, switching, merging, log inspection, remote management, fetch/pull/push"
version = "0.2.4"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rune-git-native"
path = "src/bin/native_sidecar.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
rune-pdk.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune-sidecar.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk.workspace = true

[dev-dependencies]
tempfile.workspace = true
