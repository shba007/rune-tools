[package]
name = "rune-figma"
version = "0.2.1"
edition = "2024"
license = "MIT"
authors = ["Shirsendu Bairagi"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "rune-figma-native"
path = "src/bin/native_sidecar.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
rune-pdk.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune-sidecar.workspace = true
tokio.workspace = true
futures-util = "0.3"
tokio-tungstenite = "0.26"

[dev-dependencies]
tempfile.workspace = true
