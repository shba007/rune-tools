[plugin]
name = "rune-figma"
description = "Figma integration for canvas inspection, element creation, and annotations."
version = "0.2.1"
execution_model = "native"
authors = ["Shirsendu Bairagi"]
license = "MIT"
documentation = "https://github.com/shba007/rune-tools/blob/main/plugins/rune-figma/README.md"

[capabilities]
network_hosts = ["localhost", "127.0.0.1"]
filesystem = { mode = "scoped", root_param = "allowed_dir" }
exec = { allowed_binaries = [] }
