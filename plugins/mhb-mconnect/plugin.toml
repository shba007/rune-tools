[plugin]
name = "mhb-mconnect"
version = "0.1.3"
execution_model = "native"
description = "MHB Interaction Service connector for email template management and rendering."
authors = ["Shirsendu Bairagi"]
license = "MIT"
documentation = "https://github.com/shba007/rune-tools/blob/main/plugins/mhb-mconnect/README.md"

[capabilities]
network_hosts = ["api.modesthumanbrands.com"]
filesystem = { mode = "scoped", root_param = "allowed_dir" }
exec = { allowed_binaries = [] }
