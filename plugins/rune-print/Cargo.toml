[package]
name = "rune-print"
description = "Native OS printing and eSCL AirScan scanning: printer discovery, spooler dispatch for TXT/PDF/images, flatbed/ADF document scans, and scanner capability queries"
version = "0.2.1"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rune-print-native"
path = "src/bin/native_sidecar.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
rune-pdk = { path = "../../crates/rune-pdk" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune-sidecar = { path = "../../crates/rune-sidecar" }
printers = "2.3"
reqwest = { workspace = true, features = ["blocking"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk.workspace = true

[dev-dependencies]
tempfile.workspace = true
