[package]
name = "rune-audio"
version = "0.2.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Audio track extraction using yt-dlp, ffmpeg, and spotdl for podcast and audio content management."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rune-audio-native"
path = "src/bin/native_sidecar.rs"
required-features = ["native"]

[features]
default = []
native = ["dep:rune-sidecar"]

[dependencies]
rune-pdk = { path = "../../crates/rune-pdk" }
rune-sidecar = { path = "../../crates/rune-sidecar", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
