[plugin]
name = "rune-time"
version = "0.3.0"
execution_model = "wasm"
description = "Deterministic timezone queries, ISO-8601 formatting, and DST-aware cross-timezone conversions."
authors = ["Shirsendu Bairagi"]
license = "MIT"
documentation = "https://github.com/shba007/rune-tools/blob/main/plugins/rune-time/README.md"

[capabilities]
network_hosts = []
exec = { allowed_binaries = [] }

[configuration]
schema_version = 1

[configuration.fields.default_timezone]
type = "string"
description = "Default IANA timezone for get_current_time when timezone is omitted."
required = false
secret = false
config_key = "default_timezone"
default = "UTC"
