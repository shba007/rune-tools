$kind: mcp-request
name: "download_video_playlist"
description: "Downloads video playlists or channels in batches with range and cookie dir auto-matching.\n\nArgument TEMPLATE only: replace <set this value> and review optional properties in inputSchema. Source: plugins/rune-video/src/definitions.rs (0.3.0). This request may have external effects when read_only_flag is cleared; no call is executed by generation.\n\ninputSchema:\n{\n  \"properties\": {\n    \"cookiesDir\": {\n      \"description\": \"Directory containing site cookie files (e.g. youtube.txt, reddit.txt, cookies.txt)\",\n      \"type\": \"string\"\n    },\n    \"cookiesFile\": {\n      \"description\": \"Explicit path to a cookies.txt file\",\n      \"type\": \"string\"\n    },\n    \"cookiesFromBrowser\": {\n      \"description\": \"Browser to load session cookies from (e.g. 'chrome', 'firefox', 'edge', 'brave')\",\n      \"type\": \"string\"\n    },\n    \"endIndex\": {\n      \"description\": \"Index of the last playlist item to download\",\n      \"type\": \"integer\"\n    },\n    \"maxVideos\": {\n      \"description\": \"Maximum number of playlist videos to download\",\n      \"type\": \"integer\"\n    },\n    \"outputDirectory\": {\n      \"description\": \"Target download directory\",\n      \"type\": \"string\"\n    },\n    \"playerClient\": {\n      \"description\": \"YouTube player client spoofing (e.g. 'android', 'web', 'ios', 'tv')\",\n      \"type\": \"string\"\n    },\n    \"proxy\": {\n      \"description\": \"HTTP/HTTPS/SOCKS proxy URL\",\n      \"type\": \"string\"\n    },\n    \"startIndex\": {\n      \"default\": 1,\n      \"description\": \"Index of the first playlist item to download\",\n      \"type\": \"integer\"\n    },\n    \"url\": {\n      \"description\": \"URL of the playlist\",\n      \"type\": \"string\"\n    }\n  },\n  \"required\": [\n    \"url\"\n  ],\n  \"type\": \"object\"\n}\n\nPlugin rules:\n{\n  \"read_only\": false,\n  \"risk\": \"medium\",\n  \"effects\": [\n    \"write\",\n    \"network\",\n    \"exec\"\n  ],\n  \"limits\": {\n    \"allowed_binaries\": [\n      \"yt-dlp\",\n      \"ffmpeg\"\n    ]\n  }\n}"
transport: stdio
command: '"{{kit_executable}}" run "{{rune_video_selector}}" {{read_only_flag}} --timeout 10 {{rune_video_parameters}}'
