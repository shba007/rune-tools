$kind: mcp-request
name: 'Read allowed file'
description: 'Read a file relative to the explicit allowed_root. Requires Filesystem 0.4.1+ and a real existing absolute allowed_root.'
transport: stdio
command: '"{{kit_executable}}" run --all --read-only --timeout 10 -p "allowed_dir={{allowed_root}}"'
settings:
  version: '2026-07-28'
  requestTimeout: 15000
message: |-
  {"id":"Read allowed file","method":"tools/call","jsonrpc":"2.0","params":{"name":"{{file_reader}}","arguments":{"path":"{{read_path}}"},"_meta":{"io.modelcontextprotocol/clientInfo":{"version":"1.0.0","name":"postman-rune-kit"},"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}

