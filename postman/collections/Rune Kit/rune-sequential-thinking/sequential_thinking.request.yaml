$kind: mcp-request
name: "sequential_thinking"
description: "A detailed tool for dynamic and reflective problem-solving through structured, step-by-step thinking processes. Facilitates adaptive reasoning, hypothesis revision, branching exploration, and progress tracking.\n\nArgument TEMPLATE only: replace <set this value> and review optional properties in inputSchema. Source: plugins/rune-sequential-thinking/src/definitions.rs (0.3.0). This request may have external effects when read_only_flag is cleared; no call is executed by generation.\n\ninputSchema:\n{\n  \"properties\": {\n    \"branchFromThought\": {\n      \"description\": \"Branching point thought number if exploring an alternative hypothesis\",\n      \"minimum\": 1,\n      \"type\": \"integer\"\n    },\n    \"branchId\": {\n      \"description\": \"Identifier for the alternative reasoning branch\",\n      \"type\": \"string\"\n    },\n    \"isRevision\": {\n      \"description\": \"Whether this thought revises, corrects, or replaces previous thinking\",\n      \"type\": \"boolean\"\n    },\n    \"needsMoreThoughts\": {\n      \"description\": \"Explicit signal that additional thinking steps beyond totalThoughts are required\",\n      \"type\": \"boolean\"\n    },\n    \"nextThoughtNeeded\": {\n      \"description\": \"Whether another thought step is needed to continue reasoning\",\n      \"type\": \"boolean\"\n    },\n    \"revisesThought\": {\n      \"description\": \"Which thought number is being reconsidered or revised\",\n      \"minimum\": 1,\n      \"type\": \"integer\"\n    },\n    \"thought\": {\n      \"description\": \"The current thinking step containing analysis, hypothesis, or verification\",\n      \"type\": \"string\"\n    },\n    \"thoughtNumber\": {\n      \"description\": \"Current thought number in the sequence\",\n      \"minimum\": 1,\n      \"type\": \"integer\"\n    },\n    \"totalThoughts\": {\n      \"description\": \"Estimated total thoughts needed (can be dynamically adjusted)\",\n      \"minimum\": 1,\n      \"type\": \"integer\"\n    }\n  },\n  \"required\": [\n    \"thought\",\n    \"nextThoughtNeeded\",\n    \"thoughtNumber\",\n    \"totalThoughts\"\n  ],\n  \"type\": \"object\"\n}\n\nPlugin rules:\n{\n  \"read_only\": false,\n  \"risk\": \"low\",\n  \"effects\": [\n    \"write\"\n  ]\n}"
transport: stdio
command: '"{{kit_executable}}" run "{{rune_sequential_thinking_selector}}" {{read_only_flag}} --timeout 10 {{rune_sequential_thinking_parameters}}'
