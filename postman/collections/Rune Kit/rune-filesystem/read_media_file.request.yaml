description: "Read an image or media file. Images are returned directly as visual image blocks for multimodal vision models up to 20MB. Audio and binary return as paged resources.\n\nArgument TEMPLATE only: replace <set this value> and review optional properties in inputSchema. Source: plugins/rune-filesystem/src/definitions.rs (0.4.1). This request may have external effects when read_only_flag is cleared; no call is executed by generation.\n\ninputSchema:\n{\n  \"properties\": {\n    \"length\": {\n      \"description\": \"Bytes to read (defaults to full file for images up to 20MB, capped at 512KB for non-images)\",\n      \"type\": \"number\"\n    },\n    \"offset\": {\n      \"description\": \"Byte offset to start reading from (default 0)\",\n      \"type\": \"number\"\n    },\n    \"path\": {\n      \"description\": \"Path to the media/binary file. Can be relative to the allowed directory or an absolute path within it.\",\n      \"type\": \"string\"\n    }\n  },\n  \"required\": [\n    \"path\"\n  ],\n  \"type\": \"object\"\n}\n\nPlugin rules:\n{\n  \"read_only\": false,\n  \"risk\": \"low\",\n  \"effects\": [\n    \"read\"\n  ],\n  \"limits\": {\n    \"root_param\": \"allowed_dir\"\n  }\n}"
transport: stdio
