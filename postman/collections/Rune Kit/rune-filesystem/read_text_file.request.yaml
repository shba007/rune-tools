$kind: mcp-request
name: "read_text_file"
description: "Read a UTF-8 text file inside the host-configured allowed_dir. Requires a root. Files are limited to 8 MiB; each page to 2000 lines and 64 KiB of content. Use head/tail or lineOffset/lineLimit.\n\nArgument TEMPLATE only: replace <set this value> and review optional properties in inputSchema. Source: plugins/rune-filesystem/src/definitions.rs (0.4.1). This request may have external effects when read_only_flag is cleared; no call is executed by generation.\n\ninputSchema:\n{\n  \"properties\": {\n    \"head\": {\n      \"description\": \"First N lines; cannot be combined with tail\",\n      \"maximum\": 2000,\n      \"minimum\": 0,\n      \"type\": \"integer\"\n    },\n    \"lineLimit\": {\n      \"description\": \"Max lines to return in this page (default 2000)\",\n      \"maximum\": 2000,\n      \"minimum\": 0,\n      \"type\": \"integer\"\n    },\n    \"lineOffset\": {\n      \"description\": \"0-based line number to start reading from\",\n      \"minimum\": 0,\n      \"type\": \"integer\"\n    },\n    \"path\": {\n      \"description\": \"The file path to read. Can be relative to the allowed directory (e.g. 'notes.txt') or an absolute path within it.\",\n      \"type\": \"string\"\n    },\n    \"tail\": {\n      \"description\": \"Last N lines; cannot be combined with head\",\n      \"maximum\": 2000,\n      \"minimum\": 0,\n      \"type\": \"integer\"\n    }\n  },\n  \"required\": [\n    \"path\"\n  ],\n  \"type\": \"object\",\n  \"x-rune-read-limits\": {\n    \"maxContentBytes\": 65536,\n    \"maxInputBytes\": 8388608,\n    \"maxLines\": 2000\n  }\n}\n\nPlugin rules:\n{\n  \"read_only\": true,\n  \"risk\": \"low\",\n  \"effects\": [\n    \"read\"\n  ],\n  \"limits\": {\n    \"root_param\": \"allowed_dir\"\n  }\n}"
transport: stdio
command: '"{{kit_executable}}" run "{{rune_filesystem_selector}}" {{read_only_flag}} --timeout 10 {{rune_filesystem_parameters}}'
settings:
  version: '2026-07-28'
  requestTimeout: 15000
message: |-
  {"id":"rune-filesystem/read_text_file","jsonrpc":"2.0","method":"tools/call","params":{"_meta":{"io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"postman-rune-tools","version":"1.0.0"},"io.modelcontextprotocol/protocolVersion":"2026-07-28"},"arguments":{"path":"<set this value>"},"name":"{{rune_filesystem_namespace}}__read_text_file"}}
