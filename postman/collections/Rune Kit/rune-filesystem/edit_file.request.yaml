$kind: mcp-request
name: "edit_file"
description: "Make line-based edits to a text file. Each edit replaces exact line sequences with new content.\n\nArgument TEMPLATE only: replace <set this value> and review optional properties in inputSchema. Source: plugins/rune-filesystem/src/definitions.rs (0.4.1). This request may have external effects when read_only_flag is cleared; no call is executed by generation.\n\ninputSchema:\n{\n  \"properties\": {\n    \"dryRun\": {\n      \"default\": false,\n      \"description\": \"Preview changes using git-style diff format without saving\",\n      \"type\": \"boolean\"\n    },\n    \"edits\": {\n      \"description\": \"List of text replacement edits to apply\",\n      \"items\": {\n        \"properties\": {\n          \"newText\": {\n            \"description\": \"Text to replace with\",\n            \"type\": \"string\"\n          },\n          \"oldText\": {\n            \"description\": \"Text to search for - must match exactly\",\n            \"type\": \"string\"\n          }\n        },\n        \"required\": [\n          \"oldText\",\n          \"newText\"\n        ],\n        \"type\": \"object\"\n      },\n      \"type\": \"array\"\n    },\n    \"path\": {\n      \"description\": \"The file path to edit. Can be relative to the allowed directory or an absolute path within it.\",\n      \"type\": \"string\"\n    }\n  },\n  \"required\": [\n    \"path\",\n    \"edits\"\n  ],\n  \"type\": \"object\"\n}\n\nPlugin rules:\n{\n  \"read_only\": false,\n  \"risk\": \"medium\",\n  \"effects\": [\n    \"write\"\n  ],\n  \"limits\": {\n    \"root_param\": \"allowed_dir\"\n  }\n}"
transport: stdio
command: '"{{kit_executable}}" run "{{rune_filesystem_selector}}" {{read_only_flag}} --timeout 10 {{rune_filesystem_parameters}}'
settings:
  version: '2026-07-28'
  requestTimeout: 15000
