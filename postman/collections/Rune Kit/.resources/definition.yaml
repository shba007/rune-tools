$kind: collection
name: Rune Kit
description: All plugin tool calls through public Kit MCP 2026-07-28 stdio.
variables:
  kit_executable: rune-kit
  read_only_flag: --read-only
  allowed_root: ""
  read_path: README.md
  rules_namespace: git
  git_validator: git__validate_commit_message
  time_tool: time__get_current_time
  file_reader: filesystem__read_text_file
  directory_tool: filesystem__list_directory
  file_writer: filesystem__write_file
  mhb_mconnect_selector: "mhb-mconnect"
  mhb_mconnect_namespace: "mhb-mconnect"
  mhb_mconnect_parameters: ""
  rune_audio_selector: "rune-audio"
  rune_audio_namespace: "rune-audio"
  rune_audio_parameters: ""
  rune_browser_selector: "rune-browser"
  rune_browser_namespace: "rune-browser"
  rune_browser_parameters: ""
  rune_email_selector: "rune-email"
  rune_email_namespace: "rune-email"
  rune_email_parameters: ""
  rune_fetch_selector: "rune-fetch"
  rune_fetch_namespace: "rune-fetch"
  rune_fetch_parameters: ""
  rune_figma_selector: "rune-figma"
  rune_figma_namespace: "rune-figma"
  rune_figma_parameters: ""
  rune_filesystem_selector: "rune-filesystem"
  rune_filesystem_namespace: "rune-filesystem"
  rune_filesystem_parameters: "-p \"allowed_dir={{allowed_root}}\""
  rune_git_selector: "rune-git"
  rune_git_namespace: "rune-git"
  rune_git_parameters: ""
  rune_image_selector: "rune-image"
  rune_image_namespace: "rune-image"
  rune_image_parameters: ""
  rune_memory_selector: "rune-memory"
  rune_memory_namespace: "rune-memory"
  rune_memory_parameters: ""
  rune_print_selector: "rune-print"
  rune_print_namespace: "rune-print"
  rune_print_parameters: ""
  rune_scan_selector: "rune-scan"
  rune_scan_namespace: "rune-scan"
  rune_scan_parameters: ""
  rune_sequential_thinking_selector: "rune-sequential-thinking"
  rune_sequential_thinking_namespace: "rune-sequential-thinking"
  rune_sequential_thinking_parameters: ""
  rune_slides_selector: "rune-slides"
  rune_slides_namespace: "rune-slides"
  rune_slides_parameters: ""
  rune_ssh_selector: "rune-ssh"
  rune_ssh_namespace: "rune-ssh"
  rune_ssh_parameters: ""
  rune_time_selector: "rune-time"
  rune_time_namespace: "rune-time"
  rune_time_parameters: ""
  rune_video_selector: "rune-video"
  rune_video_namespace: "rune-video"
  rune_video_parameters: ""
