$kind: mcp-request
name: "compare_images"
description: "Compares two images pixel-by-pixel and generates a visual difference image showing mismatches. Supports multiple algorithms (RMS for exact match, MSSIM for structural similarity, perceptual for human-perceived differences).\n\nArgument TEMPLATE only: replace <set this value> and review optional properties in inputSchema. Source: plugins/rune-image/src/definitions.rs (0.3.0). This request may have external effects when read_only_flag is cleared; no call is executed by generation.\n\ninputSchema:\n{\n  \"properties\": {\n    \"algorithm\": {\n      \"description\": \"Comparison algorithm: 'rms' (pixel-by-pixel exact match), 'mssim' (structural similarity), 'perceptual' (human-perceived differences). Defaults to 'rms'.\",\n      \"type\": \"string\"\n    },\n    \"image1Path\": {\n      \"description\": \"Path to the first image file (PNG, JPEG, GIF, SVG or WebP)\",\n      \"type\": \"string\"\n    },\n    \"image2Path\": {\n      \"description\": \"Path to the second image file (PNG, JPEG, GIF, SVG or WebP)\",\n      \"type\": \"string\"\n    },\n    \"outputPath\": {\n      \"description\": \"Path for the difference image output. Defaults to './diff.png'.\",\n      \"type\": \"string\"\n    },\n    \"threshold\": {\n      \"description\": \"Threshold for considering pixels different (0.0-1.0). Lower = more strict. Defaults to 0.0 (exact match).\",\n      \"type\": \"number\"\n    }\n  },\n  \"required\": [\n    \"image1Path\",\n    \"image2Path\"\n  ],\n  \"type\": \"object\"\n}\n\nPlugin rules:\n{\n  \"read_only\": false,\n  \"risk\": \"low\",\n  \"effects\": [\n    \"write\"\n  ],\n  \"limits\": {\n    \"root_param\": \"output_dir\"\n  }\n}"
transport: stdio
command: '"{{kit_executable}}" run "{{rune_image_selector}}" {{read_only_flag}} --timeout 10 {{rune_image_parameters}}'
settings:
  version: '2026-07-28'
  requestTimeout: 15000
message: |-
