description: "Downloads image galleries, multi-image posts, or artist boards with cookie dir auto-matching.\n\nArgument TEMPLATE only: replace <set this value> and review optional properties in inputSchema. Source: plugins/rune-image/src/definitions.rs (0.3.0). This request may have external effects when read_only_flag is cleared; no call is executed by generation.\n\ninputSchema:\n{\n  \"properties\": {\n    \"cookiesDir\": {\n      \"description\": \"Directory containing site cookie files (e.g. reddit.txt, cookies.txt)\",\n      \"type\": \"string\"\n    },\n    \"cookiesFile\": {\n      \"description\": \"Explicit path to a cookies.txt file\",\n      \"type\": \"string\"\n    },\n    \"cookiesFromBrowser\": {\n      \"description\": \"Browser to load session cookies from\",\n      \"type\": \"string\"\n    },\n    \"filterRange\": {\n      \"description\": \"Range of items to download (e.g. '1-10')\",\n      \"type\": \"string\"\n    },\n    \"outputDirectory\": {\n      \"description\": \"Target directory for saved images\",\n      \"type\": \"string\"\n    },\n    \"proxy\": {\n      \"description\": \"HTTP/HTTPS/SOCKS proxy URL\",\n      \"type\": \"string\"\n    },\n    \"url\": {\n      \"description\": \"Gallery URL\",\n      \"type\": \"string\"\n    }\n  },\n  \"required\": [\n    \"url\"\n  ],\n  \"type\": \"object\"\n}\n\nPlugin rules:\n{\n  \"read_only\": false,\n  \"risk\": \"medium\",\n  \"effects\": [\n    \"write\",\n    \"network\",\n    \"exec\"\n  ],\n  \"limits\": {\n    \"allowed_binaries\": [\n      \"gallery-dl\"\n    ]\n  }\n}"
