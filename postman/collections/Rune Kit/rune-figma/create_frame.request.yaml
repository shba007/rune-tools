description: "Create a new frame in Figma with optional layout and styling configurations\n\nArgument TEMPLATE only: replace <set this value> and review optional properties in inputSchema. Source: plugins/rune-figma/src/definitions.rs (0.3.0). This request may have external effects when read_only_flag is cleared; no call is executed by generation.\n\ninputSchema:\n{\n  \"properties\": {\n    \"counterAxisAlignItems\": {\n      \"description\": \"Counter axis alignment (MIN, MAX, CENTER, BASELINE)\",\n      \"enum\": [\n        \"MIN\",\n        \"MAX\",\n        \"CENTER\",\n        \"BASELINE\"\n      ],\n      \"type\": \"string\"\n    },\n    \"fillColor\": {\n      \"description\": \"Fill color in RGBA format (values 0-1)\",\n      \"properties\": {\n        \"a\": {\n          \"description\": \"Alpha component (0-1)\",\n          \"maximum\": 1,\n          \"minimum\": 0,\n          \"type\": \"number\"\n        },\n        \"b\": {\n          \"description\": \"Blue component (0-1)\",\n          \"maximum\": 1,\n          \"minimum\": 0,\n          \"type\": \"number\"\n        },\n        \"g\": {\n          \"description\": \"Green component (0-1)\",\n          \"maximum\": 1,\n          \"minimum\": 0,\n          \"type\": \"number\"\n        },\n        \"r\": {\n          \"description\": \"Red component (0-1)\",\n          \"maximum\": 1,\n          \"minimum\": 0,\n          \"type\": \"number\"\n        }\n      },\n      \"required\": [\n        \"r\",\n        \"g\",\n        \"b\"\n      ],\n      \"type\": \"object\"\n    },\n    \"height\": {\n      \"description\": \"Height of the frame\",\n      \"type\": \"number\"\n    },\n    \"itemSpacing\": {\n      \"description\": \"Distance between children in auto-layout frame in pixels\",\n      \"type\": \"number\"\n    },\n    \"layoutMode\": {\n      \"description\": \"Auto-layout mode for the frame (NONE, HORIZONTAL, VERTICAL)\",\n      \"enum\": [\n        \"NONE\",\n        \"HORIZONTAL\",\n        \"VERTICAL\"\n      ],\n      \"type\": \"string\"\n    },\n    \"layoutSizingHorizontal\": {\n      \"description\": \"Horizontal layout sizing mode (FIXED, HUG, FILL)\",\n      \"enum\": [\n        \"FIXED\",\n        \"HUG\",\n        \"FILL\"\n      ],\n      \"type\": \"string\"\n    },\n    \"layoutSizingVertical\": {\n      \"description\": \"Vertical layout sizing mode (FIXED, HUG, FILL)\",\n      \"enum\": [\n        \"FIXED\",\n        \"HUG\",\n        \"FILL\"\n      ],\n      \"type\": \"string\"\n    },\n    \"layoutWrap\": {\n      \"description\": \"Whether the auto-layout frame wraps its children (NO_WRAP, WRAP)\",\n      \"enum\": [\n        \"NO_WRAP\",\n        \"WRAP\"\n      ],\n      \"type\": \"string\"\n    },\n    \"name\": {\n      \"description\": \"Optional name for the frame\",\n      \"type\": \"string\"\n    },\n    \"paddingBottom\": {\n      \"description\": \"Bottom padding for auto-layout frame in pixels\",\n      \"type\": \"number\"\n    },\n    \"paddingLeft\": {\n      \"description\": \"Left padding for auto-layout frame in pixels\",\n      \"type\": \"number\"\n    },\n    \"paddingRight\": {\n      \"description\": \"Right padding for auto-layout frame in pixels\",\n      \"type\": \"number\"\n    },\n    \"paddingTop\": {\n      \"description\": \"Top padding for auto-layout frame in pixels\",\n      \"type\": \"number\"\n    },\n    \"parentId\": {\n      \"description\": \"Optional parent node ID to append the frame to\",\n      \"type\": \"string\"\n    },\n    \"primaryAxisAlignItems\": {\n      \"description\": \"Primary axis alignment (MIN, MAX, CENTER, SPACE_BETWEEN)\",\n      \"enum\": [\n        \"MIN\",\n        \"MAX\",\n        \"CENTER\",\n        \"SPACE_BETWEEN\"\n      ],\n      \"type\": \"string\"\n    },\n    \"strokeColor\": {\n      \"description\": \"Stroke color in RGBA format (values 0-1)\",\n      \"properties\": {\n        \"a\": {\n          \"description\": \"Alpha component (0-1)\",\n          \"maximum\": 1,\n          \"minimum\": 0,\n          \"type\": \"number\"\n        },\n        \"b\": {\n          \"description\": \"Blue component (0-1)\",\n          \"maximum\": 1,\n          \"minimum\": 0,\n          \"type\": \"number\"\n        },\n        \"g\": {\n          \"description\": \"Green component (0-1)\",\n          \"maximum\": 1,\n          \"minimum\": 0,\n          \"type\": \"number\"\n        },\n        \"r\": {\n          \"description\": \"Red component (0-1)\",\n          \"maximum\": 1,\n          \"minimum\": 0,\n          \"type\": \"number\"\n        }\n      },\n      \"required\": [\n        \"r\",\n        \"g\",\n        \"b\"\n      ],\n      \"type\": \"object\"\n    },\n    \"strokeWeight\": {\n      \"description\": \"Stroke weight in pixels\",\n      \"minimum\": 0,\n      \"type\": \"number\"\n    },\n    \"width\": {\n      \"description\": \"Width of the frame\",\n      \"type\": \"number\"\n    },\n    \"x\": {\n      \"description\": \"X position on canvas\",\n      \"type\": \"number\"\n    },\n    \"y\": {\n      \"description\": \"Y position on canvas\",\n      \"type\": \"number\"\n    }\n  },\n  \"required\": [\n    \"x\",\n    \"y\",\n    \"width\",\n    \"height\"\n  ],\n  \"type\": \"object\",\n  \"x-rune-rules\": {\n    \"effects\": [\n      \"write\",\n      \"network\"\n    ],\n    \"limits\": {\n      \"network_hosts\": [\n        \"127.0.0.1\",\n        \"localhost\"\n      ]\n    },\n    \"read_only\": false,\n    \"risk\": \"low\"\n  }\n}\n\nPlugin rules:\n{\n  \"read_only\": false,\n  \"risk\": \"low\",\n  \"effects\": [\n    \"write\",\n    \"network\"\n  ],\n  \"limits\": {\n    \"network_hosts\": [\n      \"127.0.0.1\",\n      \"localhost\"\n    ]\n  }\n}"
