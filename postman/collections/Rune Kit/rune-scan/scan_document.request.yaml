description: "Scans a document from flatbed glass or ADF via eSCL AirScan directly into PDF or JPEG.\n\nArgument TEMPLATE only: replace <set this value> and review optional properties in inputSchema. Source: plugins/rune-scan/src/definitions.rs (not specified in plugin.toml). This request may have external effects when read_only_flag is cleared; no call is executed by generation.\n\ninputSchema:\n{\n  \"properties\": {\n    \"colorMode\": {\n      \"default\": \"Color\",\n      \"description\": \"Color capture mode\",\n      \"enum\": [\n        \"Color\",\n        \"Grayscale\",\n        \"BlackAndWhite1\"\n      ],\n      \"type\": \"string\"\n    },\n    \"inputSource\": {\n      \"default\": \"Platen\",\n      \"description\": \"Scanner input tray/glass source\",\n      \"enum\": [\n        \"Platen\",\n        \"Adf\"\n      ],\n      \"type\": \"string\"\n    },\n    \"outputPath\": {\n      \"description\": \"Destination file path on host disk (.pdf or .jpg/.jpeg)\",\n      \"type\": \"string\"\n    },\n    \"resolutionDpi\": {\n      \"default\": 300,\n      \"description\": \"Scan resolution in DPI\",\n      \"enum\": [\n        75,\n        100,\n        150,\n        200,\n        300,\n        400,\n        600,\n        1200\n      ],\n      \"type\": \"integer\"\n    },\n    \"scannerIp\": {\n      \"description\": \"Scanner IP address or hostname\",\n      \"type\": \"string\"\n    }\n  },\n  \"required\": [\n    \"outputPath\",\n    \"scannerIp\"\n  ],\n  \"type\": \"object\"\n}\n\nPlugin rules:\n{\n  \"read_only\": false,\n  \"risk\": \"low\",\n  \"effects\": [\n    \"write\",\n    \"network\"\n  ]\n}"
