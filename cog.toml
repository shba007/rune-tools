from_latest_tag = false
ignore_merge_commits = false
ignore_fixup_commits = false
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
branch_whitelist = []
pre = "alpha.*"
skip_ci = "[skip ci]"
skip_untracked = false
pre_bump_hooks = []
post_bump_hooks = []
pre_package_bump_hooks = []
post_package_bump_hooks = []

# Embedded git-hooks script
# Runs on 'git commit' to validate the commit message format
[git_hooks.commit-msg]
script = """#!/bin/sh
set -e

echo "Auto-formatting code..."
cargo fmt --all

echo "Applying Clippy fixes..."
cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged

# Stage any automatically fixed files into the current commit
git update-index --again

cog verify --file "$1"
"""

[commit_types]

[changelog]
path = "CHANGELOG.md"
authors = []

[bump_profiles]
