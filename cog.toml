# Shared Rune release policy. Cocogitto is the only changelog renderer.
from_latest_tag = true
ignore_merge_commits = true
tag_prefix = "v"

monorepo_version_separator = "-"
generate_mono_repository_global_tag = false

[commit_types]
feat = { changelog_title = "🚀 Features", bump_minor = true, order = 1 }
fix = { changelog_title = "🐛 Bug Fixes", bump_patch = true, order = 2 }
perf = { changelog_title = "⚡ Performance", bump_patch = true, order = 3 }
refactor = { changelog_title = "🚜 Refactoring", bump_patch = true, order = 4 }
docs = { changelog_title = "📚 Documentation", bump_patch = true, order = 5 }
style = { changelog_title = "🎨 Style", bump_patch = true, order = 6 }
test = { changelog_title = "🧪 Testing", bump_patch = true, order = 7 }
build = { changelog_title = "📦 Build", bump_patch = true, order = 8 }
ci = { changelog_title = "🤖 Continuous Integration", bump_patch = true, order = 9 }
chore = { changelog_title = "⚙️ Miscellaneous", bump_patch = true, order = 10 }
revert = { changelog_title = "⏪ Reverts", bump_patch = true, order = 11 }
custom = { changelog_title = "Other Changes", bump_patch = true, order = 12 }

[git_hooks.commit-msg]
script = "cog verify --file $1"

[changelog]
path = "CHANGELOG.md"
template = ".release/changelog.tera"
remote = "github.com"
owner = "shba007"
repository = "rune-tools"

# Package selection remains repository-specific. No mutating bump hooks.
[monorepo]
resolver = "Cargo"

[monorepo.packages]
mhb-mconnect = { path = "plugins/mhb-mconnect" }
rune-audio = { path = "plugins/rune-audio" }
rune-browser = { path = "plugins/rune-browser" }
rune-email = { path = "plugins/rune-email" }
rune-fetch = { path = "plugins/rune-fetch" }
rune-figma = { path = "plugins/rune-figma" }
rune-filesystem = { path = "plugins/rune-filesystem" }
rune-git = { path = "plugins/rune-git" }
rune-image = { path = "plugins/rune-image" }
rune-memory = { path = "plugins/rune-memory" }
rune-sequential-thinking = { path = "plugins/rune-sequential-thinking" }
rune-slides = { path = "plugins/rune-slides" }
rune-time = { path = "plugins/rune-time" }
rune-video = { path = "plugins/rune-video" }
