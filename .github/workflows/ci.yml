name: Rune Tools CI

permissions:
  contents: write

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - name: 📦 Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: 🧼 Check Formatting
        run: cargo fmt --all -- --check

      - name: 🧹 Lint Code
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings || echo "Linting failed, but continuing"

      # Same code path a contributor runs locally (`cargo xtask build <plugin>`),
      # so CI can never silently drift from what "it builds on my machine"
      # means. This only proves the native side compiles on Linux —
      # publish.yml's matrix is what actually produces the macOS/Windows
      # release binaries.
      - name: ⚙️ Build All Plugins (wasm + native)
        run: cargo xtask build-all

      - name: 🛠️ Setup Node (for dotenvx)
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: 🛠️ Install dotenvx
        run: npm install -g @dotenvx/dotenvx

      - name: ✅ Test All Plugins
        run: cargo xtask test-all

      - name: 🤖 AutoFix Formatting
        run: cargo fmt --all

      - name: 🤖 Commit Formatting Fixes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: apply code fixes [skip ci]'
