name: Rune Tools Publish

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  # Diffs every plugin's Cargo.toml version against registry/index.json and
  # emits build matrices containing only versions that aren't published yet.
  # If nothing changed, has_wasm/has_native are both "false" and the build
  # jobs below are skipped entirely.
  detect:
    runs-on: ubuntu-latest
    outputs:
      wasm_matrix: ${{ steps.detect.outputs.wasm_matrix }}
      native_matrix: ${{ steps.detect.outputs.native_matrix }}
      has_wasm: ${{ steps.detect.outputs.has_wasm }}
      has_native: ${{ steps.detect.outputs.has_native }}
      release_matrix: ${{ steps.detect.outputs.release_matrix }}
      has_releases: ${{ steps.detect.outputs.has_releases }}
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 🛠️ Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: 🔎 Detect publishable plugin versions
        id: detect
        run: |
          python scripts/plugin-release.py validate --output release-notes --github-output "$GITHUB_OUTPUT"
          cargo xtask detect-publishable

      - name: Save validated release-note previews
        if: steps.detect.outputs.has_releases == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-note-previews
          path: release-notes/
          if-no-files-found: error

  build-wasm:
    permissions:
      contents: read
      attestations: write
      id-token: write
    needs: detect
    if: needs.detect.outputs.has_wasm == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.wasm_matrix) }}
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🛠️ Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: 📦 Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: ⚙️ Build
        run: cargo build --locked -p ${{ matrix.name }} --release --target wasm32-wasip1 --lib

      - name: 📦 Package
        run: |
          mkdir -p dist
          cp target/wasm32-wasip1/release/${{ matrix.artifact_name }}.wasm \
             dist/${{ matrix.name }}-${{ matrix.version }}.wasm

      - name: 📝 Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.name }}-${{ matrix.version }}.wasm

      - name: Save immutable built payload for publication retries
        uses: actions/upload-artifact@v4
        with:
          name: plugin-payload-${{ matrix.name }}-wasm
          path: dist/*
          if-no-files-found: error

  build-native:
    permissions:
      contents: read
      attestations: write
      id-token: write
    needs: detect
    if: needs.detect.outputs.has_native == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.native_matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🛠️ Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 📦 Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: ⚙️ Build
        run: cargo build --locked -p ${{ matrix.name }} --release --target ${{ matrix.target }} --bin ${{ matrix.bin_name }} --features native

      - name: 📦 Package (Unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar czf dist/${{ matrix.bin_name }}-${{ matrix.version }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release ${{ matrix.bin_name }}

      - name: 📦 Package (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }}.exe `
            -DestinationPath dist/${{ matrix.bin_name }}-${{ matrix.version }}-${{ matrix.target }}.zip

      - name: 📝 Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.bin_name }}-${{ matrix.version }}-${{ matrix.target }}.${{ matrix.ext }}

      - name: Save immutable built payload for publication retries
        uses: actions/upload-artifact@v4
        with:
          name: plugin-payload-${{ matrix.name }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [detect, build-wasm, build-native]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.has_releases == 'true' &&
      (needs.build-wasm.result == 'success' || needs.build-wasm.result == 'skipped') &&
      (needs.build-native.result == 'success' || needs.build-native.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.release_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-payload-${{ matrix.name }}-*
          path: dist
          merge-multiple: true
      - name: Publish exact changelog notes, payloads and SHA-256 sidecars
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/plugin-release.py publish '${{ matrix.name }}' '${{ matrix.version }}'
          --assets-dir dist --repo '${{ github.repository }}' --target '${{ github.sha }}'

  registry-handoff:
    needs: [detect, publish]
    if: >-
      always() && needs.detect.outputs.has_releases == 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify published payloads and prepare owner registry patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/plugin-release.py registry --repo '${{ github.repository }}'
          --target '${{ github.sha }}' --output registry-handoff
      - name: Save registry handoff for owner review and source commit
        uses: actions/upload-artifact@v4
        with:
          name: registry-handoff
          path: registry-handoff/
          if-no-files-found: error
