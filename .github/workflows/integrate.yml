name: Rune Tools CI
permissions:
  contents: read
on:
  push:
    branches: [develop]
env:
  CARGO_TERM_COLOR: always
  CARGO_HUSKY_DONT_INSTALL_HOOKS: 'true'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate workflow syntax and expressions
        uses: docker://rhysd/actionlint:1.7.12
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-wasip1
          components: rustfmt, clippy
      - run: cargo fetch --locked
      - run: cargo test --locked -p xtask
      - run: cargo xtask validate --output release-notes
      - run: cargo xtask build-all
      - name: Detect configuration requiring dotenvx
        id: config
        run: cargo xtask env-requirements
      - uses: actions/setup-node@v7
        if: steps.config.outputs.dotenvx == 'true'
        with:
          node-version: 'lts/*'
      - if: steps.config.outputs.dotenvx == 'true'
        run: npm install -g @dotenvx/dotenvx
      - run: cargo xtask test-all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo fmt --all --check
  prepare:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-release-preparation
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
      - name: Reject stale preparation run
        id: current
        shell: bash
        run: |
          git fetch origin develop
          if [ "$(git rev-parse origin/develop)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare affected versions and substantive changelogs
        if: steps.current.outputs.current == 'true'
        id: prepare
        run: cargo xtask prepare --apply --summary release-summary.md
      - name: Validate generated release files
        if: steps.prepare.outputs.prepared == 'true'
        run: |
          cargo test --locked -p xtask
          cargo xtask validate --output release-notes
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo fmt --all --check
      - name: Require event-capable branch authentication
        if: steps.prepare.outputs.prepared == 'true'
        env:
          RELEASE_BRANCH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$RELEASE_BRANCH_TOKEN" ]; then
            echo 'GH_TOKEN with Contents write is required to push the preparation branch. Generated files are validated in this run.' >&2
            exit 1
          fi
      - name: Recheck tested source before updating the release PR
        if: steps.prepare.outputs.prepared == 'true'
        shell: bash
        run: |
          git fetch origin develop
          if [ "$(git rev-parse origin/develop)" != "$GITHUB_SHA" ]; then
            echo 'Develop advanced during preparation; the newer validated run must prepare the PR.' >&2
            exit 1
          fi
      - name: Open or update the single preparation PR
        if: steps.prepare.outputs.prepared == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch-token: ${{ secrets.GH_TOKEN }}
          branch: release/update-version
          base: develop
          title: 'ci(release): update version'
          commit-message: 'ci(release): update version'
          body-path: release-summary.md
          add-paths: |
            plugins/*/Cargo.toml
            plugins/*/plugin.toml
            plugins/*/CHANGELOG.md
            Cargo.lock
            .release/prepared.json
