name: Rune Tools CI

permissions:
  contents: read

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: >
      !(
        contains(github.event.head_commit.message, 'ci(release):') ||
        contains(github.event.head_commit.message, '[skip ci]') ||
        startsWith(github.event.head_commit.message, 'Merge pull request') ||
        startsWith(github.event.head_commit.message, 'Merge branch')
      )
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Setup Rust with clippy, rustfmt, the wasm target and automatic dependency caching
      - name: 🛠️ Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-wasip1
          components: rustfmt, clippy

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Test local release validation and public MCP clients
        run: python -m unittest discover -s scripts/tests -v

      - name: Validate pending plugin release notes without publishing
        run: python scripts/plugin-release.py validate --output release-notes

      # Verify Cargo.lock is synced with Cargo.toml (equivalent to --frozen-lockfile)
      - name: 📦 Verify Dependencies
        run: cargo fetch --locked

      # Same code path a contributor runs locally (`cargo xtask build <plugin>`).
      # This only proves the native side compiles on Linux — publish.yml's
      # matrix is what produces the macOS/Windows release binaries.
      - name: ⚙️ Build All Plugins (wasm + native)
        run: cargo xtask build-all

      - name: 🛠️ Setup Node (for dotenvx)
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: 🛠️ Install dotenvx
        run: npm install -g @dotenvx/dotenvx

      - name: ✅ Test All Plugins
        run: cargo xtask test-all

      - name: 🧹 Lint Code
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: 🧼 Format Code
        run: cargo fmt --all --check
